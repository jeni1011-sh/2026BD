<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Surprise ❤️</title>

    <style>

        /* Whole page */
        body {
            margin: 0;
            min-height: 100vh;
            background-color: rgb(40, 29, 23);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Background image */
        .our {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;
            opacity: 0.2;

            z-index: 0;
            pointer-events: none;
        }

        /* Main content */
        .box {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
            
            width: 300px;
            padding: 25px;

            text-align: center;
            color: azure;

            z-index: 1;
        }

        /* Main picture */
        .box > img:not(.our) {
            width: 200px;
            height: 200px;

            object-fit: cover;

            border-radius: 15px;

            margin: 0 auto 25px auto;

            display: block;
        }
       #but{
        border-color: rgb(0, 0, 0);
        padding: 20px;
        border-radius: 5px;
        border-width: 5px;
       background-color:transparent;
       color: rgb(239, 231, 231);
       font-size: larger;
       font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif
       }
        
        h1 {
            margin: 0;

            font-size: 24px;
            line-height: 1.5;

            width: 100%;

            word-break: normal;
            overflow-wrap: break-word;
        }

    </style>
</head>

<body>

    <img
        src="c:\Users\jenisha\OneDrive\Documents\surprise\ours2.jpeg"
        class="our"
        alt="Background"
    >

    <div class="box">
        <img
            src="c:\Users\jenisha\OneDrive\Documents\surprise\happyy.jpeg"
            alt="Happy"
        >

        <h1>
           Awwwww!! my sweet little baby🥹🥹 I knew that you love me more ❤️😘🥰😘
        </h1>
        <button id="but">Baby click🥰</button>

    </div>
    <script>
        const but=document.getElementById("but");
        but.addEventListener("click",function(){
             window.location.href="p3.html";
        });
    </script>
</body>

</html>
